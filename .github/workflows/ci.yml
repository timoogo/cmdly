name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages and applications
        run: pnpm build
      - name: Typecheck packages and applications, including docs examples
        run: pnpm -r --if-present typecheck
      - name: Test core and React
        run: pnpm --filter @cmdly/core test && pnpm --filter @cmdly/react test
      - name: Test playground
        run: pnpm --filter playground test
      - name: Install Chromium
        run: pnpm --filter @cmdly/docs exec playwright install --with-deps chromium
      - name: Test documentation in browser
        run: pnpm --filter @cmdly/docs test:browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            apps/docs/test-results/
            apps/docs/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Check npm tarballs in an independent project
        run: pnpm check:pack
      - name: Check whitespace
        run: git diff --check
